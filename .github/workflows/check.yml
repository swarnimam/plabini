name: Check wedding website

on:
  pull_request:
    branches: [main]
  push:
    branches: ["codex/**"]

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify (${{ matrix.base }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        base: ["/", "/plabini"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://swarnimam.github.io
          BASE_PATH: ${{ matrix.base }}
      - name: Verify assets, invitation details and calendars
        run: npm run verify
